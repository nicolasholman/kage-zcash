[workspace]
resolver = "2"
members = [
    "crates/spendguard",
    "crates/x402z-protocol",
    "crates/x402z-server",
    "crates/x402z-facilitator",
    "crates/x402z-agent",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

# Zcash crates (checked on crates.io 2026-10-20; not added yet, see README "Blockers"):
# zcash_client_backend 0.24.0 (features incl. lightwalletd-tonic, orchard, sync)
# zcash_client_sqlite 0.22.0, zcash_keys 0.16.1, zcash_primitives 0.30.1, zcash_protocol 0.10.6
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
