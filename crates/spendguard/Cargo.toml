[package]
name = "spendguard"
description = "Per-agent spend caps, host allowlist and approval threshold for x402z payments"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Ledger at rest: XChaCha20-Poly1305 (`sealed`). No RNG here: callers pass the 24-byte nonce.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
