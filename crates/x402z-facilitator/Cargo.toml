[package]
name = "x402z-facilitator"
description = "x402z facilitator: verifies shielded payments with the merchant UFVK via lightwalletd and signs ed25519 receipts"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "x402z-facilitator"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
x402z-protocol = { path = "../x402z-protocol" }
# Pre-release line on purpose (checked on crates.io 2026-10-20): NU7 activated on testnet at
# height 4465026 (branch id 0x77190AD9), and zcash_protocol 0.11.0-pre.* is the first release
# that knows it. The stable 0.10.6/0.30/0.24 line cannot parse current testnet transactions.
zcash_client_backend = { version = "=0.25.0-pre.2", features = ["lightwalletd-tonic", "orchard"] }
zcash_keys = { version = "=0.17.0-pre.2", features = ["orchard", "sapling"] }
zcash_primitives = "=0.31.0-pre.2"
zcash_protocol = "=0.11.0-pre.1"
orchard = "0.16"
sapling = { package = "sapling-crypto", version = "0.9" }
tonic = { version = "0.14", features = ["transport", "tls-ring", "tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
base64 = "0.22"
rand = "0.8"

[dev-dependencies]
# Integration tests build real shielded transactions (real Halo2 proofs for the Orchard-family
# bundles, transparent input signed with a real secp256k1 key).
zcash_primitives = { version = "=0.31.0-pre.2", features = ["transparent-inputs", "test-dependencies"] }
zcash_transparent = { version = "=0.11.0-pre.2", features = ["transparent-inputs", "test-dependencies"] }
sapling = { package = "sapling-crypto", version = "0.9", features = ["test-dependencies"] }
secp256k1 = "0.33"
zip32 = "0.3"
rand10 = { package = "rand", version = "0.10" }
