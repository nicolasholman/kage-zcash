name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # No CARGO_BUILD_JOBS cap here: the README's one-crate-at-a-time, 2-job advice is for low-RAM laptops.
  # GitHub's ubuntu-latest runners (4 vCPU, 16 GB) build the Zcash crates faster with every core.

jobs:
  fast:
    name: Fast tests (spendguard, protocol, server, agent, mcp, facilitator unit)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install 1.89.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p spendguard -p x402z-protocol -p x402z-server
      - run: cargo test --locked -p x402z-agent
      - run: cargo test --locked -p x402z-mcp
      - run: cargo test --locked -p x402z-facilitator --lib --bins --test zip321_uri
      # The README's "check it yourself" command runs this example; make sure it still builds.
      - run: cargo build --locked -p x402z-facilitator --examples

  real-transactions:
    name: Facilitator on in-process transactions (Halo2 proving, slow)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.89.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p x402z-facilitator --test verify_real_tx

  live-testnet:
    name: Facilitator against Zcash testnet (testnet.zec.rocks)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.89.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p x402z-facilitator --test live_testnet
